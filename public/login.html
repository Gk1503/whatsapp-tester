<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — WA Tester</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-screen">
  <div class="connect-card login-card">
    <div class="brand login-brand">
      <span class="brand-mark">WA</span>
      <span class="brand-name" style="color:var(--text-secondary)">Tester</span>
    </div>
    <h1 class="text-h2">Sign in</h1>
    <p class="panel-subtitle">Authenticate to access the dashboard.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username" class="field-label">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password" class="field-label">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button id="loginBtn" type="submit" class="btn btn-primary" style="width:100%; justify-content:center">Sign in</button>
      <div class="results" id="loginResult" aria-live="polite"></div>
    </form>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
